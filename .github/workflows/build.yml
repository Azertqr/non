name: Build NyxMenuGBR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compile NyxMenuGBR.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc -O2 -dynamiclib \
            -Wno-deprecated-declarations \
            -framework UIKit -framework Foundation \
            -install_name @rpath/NyxMenuGBR.dylib \
            -o NyxMenuGBR.dylib Tweak.mm
          codesign -f -s - NyxMenuGBR.dylib
          file NyxMenuGBR.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: NyxMenuGBR
          path: NyxMenuGBR.dylib
